server {
    listen       80;
    server_name www.persandstrom.com;
    return       301 http://persandstrom.com;
}

server {
        listen 80;
        listen [::]:80;

        server_name persandstrom.com;

        root /apps/persandstrom.com;
        index index.html;

        error_page 404 =200 /index.html;

        # Games live in /apps/persandstrom.com/games/<name>/, see GAMES.md.

        # A game with a backend: its WebSocket goes to game@<name>.service,
        # which listens on a unix socket. No backend gives a 502. Must stay
        # above the other /games/ blocks, nginx uses the first regex that
        # matches.
        location ~ ^/games/(?<game>[a-z0-9_-]+)/ws$ {
                proxy_pass http://unix:/run/games/$game/server.sock;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                # Idle connections are dropped after this, so games should
                # ping more often than this.
                proxy_read_timeout 1h;
        }

        # Vite hashes the asset filenames, so they can be cached forever.
        location ~ ^/games/[^/]+/assets/ {
                expires max;
                try_files $uri =404;
        }

        # Each game is a single page app: unknown paths fall back to that
        # game's own index.html, so client side routes survive a reload.
        location ~ ^/games/([^/]+)/ {
                add_header Cache-Control "no-cache";
                try_files $uri $uri/ /games/$1/index.html =404;
        }
}
